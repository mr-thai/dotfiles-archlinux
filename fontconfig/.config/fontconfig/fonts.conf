<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Kích hoạt khử răng cưa (Antialiasing) để làm mượt nét chữ -->
  <match target="font">
    <edit name="antialias" mode="assign">
      <bool>true</bool>
    </edit>
  </match>

  <!-- Kích hoạt Subpixel Rendering (RGB) cho màn hình LCD để chữ sắc nét hơn -->
  <match target="font">
    <edit name="rgba" mode="assign">
      <const>rgb</const>
    </edit>
  </match>

  <!-- Bộ lọc LCD mặc định giúp triệt tiêu viền màu (color fringes) xung quanh chữ -->
  <match target="font">
    <edit name="lcdfilter" mode="assign">
      <const>lcddefault</const>
    </edit>
  </match>

  <!-- Cấu hình Hinting (Slight để cân bằng độ sắc nét mà không làm biến dạng font chữ gốc) -->
  <match target="font">
    <edit name="hinting" mode="assign">
      <bool>true</bool>
    </edit>
  </match>
  <match target="font">
    <edit name="hintstyle" mode="assign">
      <const>hintslight</const>
    </edit>
  </match>

  <!-- Tắt autohint để tránh làm nhòe các font chữ vector chất lượng cao như JetBrains Mono -->
  <match target="font">
    <edit name="autohint" mode="assign">
      <bool>false</bool>
    </edit>
  </match>

  <!-- Thiết lập Font Fallbacks mặc định cho Monospace (Tránh hoàn toàn lỗi thiếu Icon & Emoji) -->
  <alias>
    <family>monospace</family>
    <prefer>
      <family>JetBrainsMono Nerd Font</family>
      <family>Symbols Nerd Font</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <!-- Áp dụng JetBrainsMono Nerd Font cho UI chung (Qt/Electron/app không chỉ định font) -->
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer>
      <family>JetBrainsMono Nerd Font</family>
      <family>Symbols Nerd Font</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
</fontconfig>
