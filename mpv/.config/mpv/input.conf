# ==============================================================================
# MPV INPUT CONFIGURATION (VIM-STYLE)
# ==============================================================================

# --- TUA VIDEO (Navigation) ---
h seek -5
l seek 5
H seek -60
L seek 60

# --- ÂM THANH (Audio & Volume) ---
k run wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
j run wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
UP run wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
DOWN run wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
WHEEL_UP run wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
WHEEL_DOWN run wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
m run wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
a cycle audio       # Đổi track âm thanh (Ví dụ đổi từ tiếng Nhật sang tiếng Anh)

# --- PLAYLIST (Danh sách phát) ---
K playlist-next     # Bấm Shift+K để sang video tiếp theo
J playlist-prev     # Bấm Shift+J để lùi video trước

# --- TỐC ĐỘ (Playback Speed) ---
[ multiply speed 1/1.1
] multiply speed 1.1
BS set speed 1.0    # Nút Backspace để reset tốc độ
SPACE cycle pause

# --- PHỤ ĐỀ (Subtitles) ---
c cycle sub         # Bật/Tắt/Đổi phụ đề
s cycle sub         # Bật/Tắt/Đổi phụ đề (dự phòng)
S cycle sub down    # Lùi lại track phụ đề trước
z add sub-delay -0.1 # Phụ đề hiện lên SỚM HƠN 0.1s
Z add sub-delay +0.1 # Phụ đề hiện lên TRỄ HƠN 0.1s

# --- GIAO DIỆN & MISC ---
f cycle fullscreen
i script-binding stats/display-stats-toggle # Hiện thông số kỹ thuật (Stats for nerds)
q quit

# Chụp ảnh video thuần khiết (không dính phụ đề, không dính OSD)
Ctrl+s screenshot video
Ctrl+Shift+s screenshot window

# --- MENU CỦA UOSC ---
mbtn_right  script-binding uosc/menu # Bấm chuột phải để mở Menu hiện đại
menu        script-binding uosc/menu # Bấm phím Menu trên bàn phím

# --- ANIME4K SHADERS (Upscale hình ảnh) ---
# Tạm thời chỉ cài đặt sẵn, khi nào sang máy mạnh (có Card rời) thì hẵng bấm Ctrl+1 để bật
CTRL+1 no-osd change-list glsl-shaders set "~~/shaders/Anime4K_Clamp_Highlights.glsl:~~/shaders/Anime4K_Restore_CNN_VL.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_VL.glsl:~~/shaders/Anime4K_AutoDownscalePre_x2.glsl:~~/shaders/Anime4K_AutoDownscalePre_x4.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl"; show-text "Anime4K: Đã bật chế độ Sắc nét (High)"
CTRL+2 no-osd change-list glsl-shaders set "~~/shaders/Anime4K_Clamp_Highlights.glsl:~~/shaders/Anime4K_Restore_CNN_Soft_VL.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_VL.glsl:~~/shaders/Anime4K_AutoDownscalePre_x2.glsl:~~/shaders/Anime4K_AutoDownscalePre_x4.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl"; show-text "Anime4K: Đã bật chế độ Mềm mại (Soft)"
CTRL+0 no-osd change-list glsl-shaders clr ""; show-text "Anime4K: Đã TẮT (Về mặc định)"
