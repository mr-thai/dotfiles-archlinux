# ==============================================================================
# MPV INPUT CONFIGURATION (VIM-STYLE)
# ==============================================================================

# --- NAVIGATION (Seeking) ---
h seek -5
l seek 5
H seek -60
L seek 60

# --- AUDIO & VOLUME (System PipeWire) ---
k run wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
j run wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
UP run wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
DOWN run wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
WHEEL_UP run wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
WHEEL_DOWN run wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
m run wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
a cycle audio       # Switch audio track (e.g. Japanese to English)

# --- PLAYLIST & CHAPTERS ---
K playlist-next     # Shift+K to next video
J playlist-prev     # Shift+J to previous video
Ctrl+Right chapter next   # Jump to next chapter
Ctrl+Left  chapter prev   # Jump to previous chapter

# --- PLAYBACK SPEED ---
[ multiply speed 1/1.1
] multiply speed 1.1
BS set speed 1.0    # Backspace to reset speed
SPACE cycle pause

# --- SUBTITLES ---
c cycle sub         # Toggle / cycle subtitle track
s cycle sub         # Backup key for cycling subtitles
S cycle sub down    # Cycle to previous subtitle track
z add sub-delay -0.1 # Show subtitles 0.1s EARLIER
Z add sub-delay +0.1 # Show subtitles 0.1s LATER

# --- UI & MISC ---
f cycle fullscreen
i script-binding stats/display-stats-toggle # Show stats for nerds
q quit

# Capture pure video frame (no subtitles, no OSD)
Ctrl+s screenshot video
Ctrl+Shift+s screenshot window

# --- UOSC MENU ---
# Right-click (mbtn_right) is already bound by uosc itself, no need to map it here
menu        script-binding uosc/menu # Menu key on the keyboard

# --- ANIME4K SHADERS (Image Upscaling) ---
# Pre-installed but disabled by default; enable on a GPU-capable machine with Ctrl+1
CTRL+1 no-osd change-list glsl-shaders set "~~/shaders/Anime4K_Clamp_Highlights.glsl:~~/shaders/Anime4K_Restore_CNN_VL.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_VL.glsl:~~/shaders/Anime4K_AutoDownscalePre_x2.glsl:~~/shaders/Anime4K_AutoDownscalePre_x4.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl"; show-text "Anime4K: Sharp (High) enabled"
CTRL+2 no-osd change-list glsl-shaders set "~~/shaders/Anime4K_Clamp_Highlights.glsl:~~/shaders/Anime4K_Restore_CNN_Soft_VL.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_VL.glsl:~~/shaders/Anime4K_AutoDownscalePre_x2.glsl:~~/shaders/Anime4K_AutoDownscalePre_x4.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl"; show-text "Anime4K: Soft enabled"
CTRL+0 no-osd change-list glsl-shaders clr ""; show-text "Anime4K: Disabled (default)"