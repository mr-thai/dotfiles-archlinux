# ==============================================================================
# MPV INPUT CONFIGURATION (VIM-STYLE)
# ==============================================================================

# --- TUA VIDEO (Navigation) ---
h seek -5
l seek 5
H seek -60
L seek 60

# --- ÂM THANH (Audio & Volume) ---
k add volume 5
j add volume -5
m cycle mute
a cycle audio       # Đổi track âm thanh (Ví dụ đổi từ tiếng Nhật sang tiếng Anh)

# --- PLAYLIST (Danh sách phát) ---
K playlist-next     # Bấm Shift+K để sang video tiếp theo
J playlist-prev     # Bấm Shift+J để lùi video trước

# --- TỐC ĐỘ (Playback Speed) ---
[ multiply speed 1/1.1
] multiply speed 1.1
BS set speed 1.0    # Nút Backspace để reset tốc độ
SPACE cycle pause

# --- PHỤ ĐỀ (Subtitles) ---
c cycle sub         # Bật/Tắt/Đổi phụ đề
s cycle sub         # Bật/Tắt/Đổi phụ đề (dự phòng)
S cycle sub down    # Lùi lại track phụ đề trước
z add sub-delay -0.1 # Phụ đề hiện lên SỚM HƠN 0.1s
Z add sub-delay +0.1 # Phụ đề hiện lên TRỄ HƠN 0.1s

# --- GIAO DIỆN & MISC ---
f cycle fullscreen
i script-binding stats/display-stats-toggle # Hiện thông số kỹ thuật (Stats for nerds)
q quit

# --- MENU CỦA UOSC ---
mbtn_right  script-binding uosc/menu # Bấm chuột phải để mở Menu hiện đại
menu        script-binding uosc/menu # Bấm phím Menu trên bàn phím
