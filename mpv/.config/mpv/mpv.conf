# Auto-fit window to content aspect ratio
autofit-larger=80%x80%
autofit-smaller=30%x30%

# --- VOLUME ---
volume-max=100
ao=pipewire,pulse
save-position-on-quit=yes
keep-open=yes # Stay on the last frame at EOF instead of quitting

# --- HARDWARE ACCELERATION & IMAGE QUALITY ---
hwdec=auto-safe # Auto hardware decoding with safe fallback (vaapi for Intel iGPU)
vo=gpu-next # Use the newest MPV engine (lighter, better rendering than gpu)
# profile=gpu-hq is skipped because it is too heavy for the iGPU (causes lag)

# --- UOSC UI (disable old UI) ---
osc=no
osd-bar=no
border=no

# --- SUBTITLES ---
sub-auto=fuzzy
# Force 100% custom styling by disabling native ASS formatting
sub-ass=no # Fully disable libass rendering (most extreme measure)
sub-font="JetBrainsMono Nerd Font"
osd-font="JetBrainsMono Nerd Font"
sub-font-size=50
sub-bold=yes
sub-color="#FFFFFFFF"
sub-border-color="#FF000000"
sub-border-size=2
sub-shadow-offset=1
sub-shadow-color="#33000000"
slang=vi,vie,vn,en,eng
alang=ja,jp,jpn,en,eng