# Basic Options
dir=/home/mr-thai/Downloads
continue=true
max-concurrent-downloads=5
max-connection-per-server=16
min-split-size=10M
split=16

# RPC Options (For aria2p to connect)
enable-rpc=true
rpc-allow-origin-all=true
rpc-listen-all=true
rpc-listen-port=6800
# Optional: Set a secret token for security
# rpc-secret=YOUR_SECRET_TOKEN

# Session Management
input-file=/home/mr-thai/.config/aria2/session.dat
save-session=/home/mr-thai/.config/aria2/session.dat
save-session-interval=60

# BitTorrent/Magnet
enable-dht=true
enable-dht6=true
enable-peer-exchange=true
dht-file-path=/home/mr-thai/.config/aria2/dht.dat
dht-file-path6=/home/mr-thai/.config/aria2/dht6.dat
seed-time=0
bt-tracker=udp://tracker.opentrackr.org:1337/announce,udp://tracker.internetwarriors.net:1337/announce
user-agent=Transmission/2.94
